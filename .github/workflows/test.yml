name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ESLint
        run: npm install --no-save eslint@8

      - name: Lint src/pkjs for ES5 compliance
        run: npx eslint src/pkjs/

      - name: Run dexcom tests
        run: node test/dexcom.test.js

      - name: Run clay-config tests
        run: node test/clay-config.test.js

      - name: Run astronomy tests
        run: node test/astronomy.test.js

      - name: Run weather tests
        run: node test/weather.test.js

      - name: Run utils tests
        run: node test/utils.test.js

      - name: Run garbage tests
        run: node test/garbage.test.js

      - name: Run glucose tests
        run: node test/glucose.test.js
